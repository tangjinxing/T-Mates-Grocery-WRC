<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>动态头部眼在手外标定</title><style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d30;--line:#263650;--accent:#39d98a;--bad:#ff6b6b;--text:#e8eef7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}.app{max-width:1500px;margin:auto;padding:18px}.top,.grid,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between;margin-bottom:14px}.layout{display:grid;grid-template-columns:minmax(580px,2fr) minmax(340px,1fr);gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.video{width:100%;aspect-ratio:16/9;object-fit:contain;background:#000;border-radius:8px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{background:#0e1727;border:1px solid var(--line);padding:10px;border-radius:8px}.value{font-size:21px;font-weight:700}.ok{color:var(--accent)}.bad{color:var(--bad)}button,input{border:1px solid var(--line);border-radius:7px;padding:9px 12px;background:#192840;color:var(--text)}button{cursor:pointer}button.primary{background:#087f5b}button.danger{background:#9f3030}button:disabled{opacity:.45}pre{white-space:pre-wrap;max-height:260px;overflow:auto}.progress{height:12px;background:#263650;border-radius:9px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent)}h1{font-size:21px;margin:0}h3{margin:4px 0 10px}@media(max-width:900px){.layout{grid-template-columns:1fr}}
</style></head><body><div class="app">
<div class="top"><h1>移动头部 · 眼在手外标定</h1><div><button id="connect">连接硬件</button> <button id="disconnect">断开</button></div></div>
<div class="layout"><section class="panel"><img class="video" src="/api/video" alt="等待相机画面"><div class="actions" style="margin-top:12px"><button class="primary" id="capture">采集</button><button id="reject">拒绝当前画面</button><button class="danger" id="undo">撤回上一组</button><button id="prev">上一节点</button><button id="next">下一节点</button><button id="calculate">结束并计算</button></div><p id="message"></p></section>
<aside class="panel"><h3>实时状态</h3><div class="cards">
<div class="card">连接<div class="value" id="online">否</div></div><div class="card">当前节点<div class="value" id="node">-</div></div>
<div class="card">实际 yaw / pitch<div class="value" id="head">-</div></div><div class="card">角点 / 亮度 / 清晰度<div class="value" id="quality">-</div></div>
<div class="card">节点采集<div class="value" id="nodeCount">0/10</div></div><div class="card">总采集<div class="value" id="totalCount">0/200</div></div></div>
<p>节点进度</p><div class="progress"><i id="bar" style="width:0"></i></div><h3 style="margin-top:16px">头部控制</h3><div class="grid"><label>yaw <input id="yaw" type="number" style="width:90px"></label><label>pitch <input id="pitch" type="number" style="width:90px"></label><button id="move">移动输入值</button><button id="moveNode">移动到当前节点</button></div>
<h3 style="margin-top:16px">机械臂末端（基座系）</h3><pre id="arm">尚未连接</pre><h3>质量与错误</h3><pre id="errors">-</pre></aside></div>
<section class="panel" style="margin-top:14px"><h3>标定结果 / 动态矩阵查询</h3><div class="grid"><label>yaw <input id="qyaw" type="number" style="width:90px"></label><label>pitch <input id="qpitch" type="number" style="width:90px"></label><button id="query">查询 base_T_camera</button></div><pre id="result">完成数据采集后点击“结束并计算”。</pre></section></div>
<script>
const $=x=>document.getElementById(x);async function api(url,body){let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});let t=await r.text(),v;try{v=JSON.parse(t)}catch{v=t}if(!r.ok)throw Error(v.detail||t);return v}function msg(x,bad=false){$('message').textContent=x;$('message').className=bad?'bad':'ok'}
async function refresh(){try{let s=await fetch('/api/status').then(r=>r.json());$('online').textContent=s.connected?'是':'否';$('online').className='value '+(s.connected?'ok':'bad');$('node').textContent=`${s.current_node.id} (${s.current_node.yaw}, ${s.current_node.pitch})`;$('yaw').value=s.current_node.yaw;$('pitch').value=s.current_node.pitch;$('head').textContent=s.head_actual.yaw==null?'-':`${s.head_actual.yaw} / ${s.head_actual.pitch}`;$('quality').textContent=`${s.quality.corners||0} / ${s.quality.brightness||'-'} / ${s.quality.blur_score||'-'}`;$('quality').className='value '+(s.quality.ok?'ok':'bad');$('nodeCount').textContent=`${s.node_count}/${s.node_target}`;$('totalCount').textContent=`${s.total_count}/${s.total_target}`;$('bar').style.width=Math.min(100,100*s.total_count/s.total_target)+'%';$('arm').textContent=s.arm?JSON.stringify(s.arm,null,2):'尚未连接';$('errors').textContent=[s.quality.reason,s.last_error].filter(Boolean).join('\n')||'-'}catch(e){msg(e.message,true)}}setInterval(refresh,500);refresh();
$('connect').onclick=()=>api('/api/connect').then(()=>msg('硬件连接成功')).catch(e=>msg(e.message,true));$('disconnect').onclick=()=>api('/api/disconnect').then(()=>msg('已断开'));$('capture').onclick=()=>api('/api/capture').then(x=>msg(`样本 ${x.index} 保存成功`)).catch(e=>msg(e.message,true));$('reject').onclick=()=>api('/api/reject').then(()=>msg('当前画面已拒绝，不计入标定样本')).catch(e=>msg(e.message,true));$('undo').onclick=()=>api('/api/undo').then(x=>msg(`样本 ${x.index} 已移入 rejected`)).catch(e=>msg(e.message,true));$('next').onclick=()=>api('/api/node/next').then(()=>msg('已切换到下一节点'));$('prev').onclick=()=>api('/api/node/previous').then(()=>msg('已切换到上一节点'));$('move').onclick=()=>api('/api/head/move',{yaw:+$('yaw').value,pitch:+$('pitch').value}).then(()=>msg('头部移动指令已发送')).catch(e=>msg(e.message,true));$('moveNode').onclick=()=>api('/api/head/current-node').then(()=>msg('正移动到当前节点')).catch(e=>msg(e.message,true));$('calculate').onclick=()=>{msg('正在计算，请稍候…');api('/api/calibrate').then(x=>{$('result').textContent=JSON.stringify(x,null,2);msg(`完成：${x.nodes.length} 个头部节点标定成功`)}).catch(e=>msg(e.message,true))};$('query').onclick=()=>api('/api/query-transform',{yaw:+$('qyaw').value,pitch:+$('qpitch').value}).then(x=>$('result').textContent=JSON.stringify(x,null,2)).catch(e=>msg(e.message,true));
</script></body></html>

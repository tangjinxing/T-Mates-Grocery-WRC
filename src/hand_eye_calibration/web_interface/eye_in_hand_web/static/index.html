<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>眼在手上手眼标定</title><style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d30;--line:#263650;--accent:#39d98a;--warn:#ffcc66;--bad:#ff6b6b;--text:#e8eef7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}.app{max-width:1500px;margin:auto;padding:18px}.top,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between;margin-bottom:14px}.layout{display:grid;grid-template-columns:minmax(580px,2fr) minmax(360px,1fr);gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.video{width:100%;aspect-ratio:16/9;object-fit:contain;background:#000;border-radius:8px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{background:#0e1727;border:1px solid var(--line);padding:10px;border-radius:8px}.value{font-size:20px;font-weight:700}.ok{color:var(--accent)}.bad{color:var(--bad)}.warn{color:var(--warn)}button{border:1px solid var(--line);border-radius:7px;padding:10px 14px;background:#192840;color:var(--text);cursor:pointer}button.primary{background:#087f5b}button.danger{background:#9f3030}pre{white-space:pre-wrap;max-height:280px;overflow:auto}.progress{height:12px;background:#263650;border-radius:9px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent)}h1{font-size:22px;margin:0}h3{margin:4px 0 10px}.notice{border-left:4px solid var(--warn);padding:9px 12px;background:#302718;margin-bottom:12px}@media(max-width:900px){.layout{grid-template-columns:1fr}}
</style></head><body><div class="app">
<div class="top"><h1 id="title">眼在手上 · 手眼标定</h1><div><button id="connect">连接硬件</button> <button id="disconnect">断开</button></div></div>
<div class="notice">ChArUco板必须刚性固定在机器人外部，整个采集过程中禁止移动；由机械臂带着末端相机改变位置和绕多个轴的姿态。</div>
<div class="layout"><section class="panel"><img class="video" src="/api/video" alt="等待相机画面"><div class="actions" style="margin-top:12px"><button class="primary" id="capture">采集</button><button id="reject">拒绝当前画面</button><button class="danger" id="undo">撤回上一组</button><button id="calculate">结束并计算</button></div><p id="message"></p></section>
<aside class="panel"><h3>实时状态</h3><div class="cards">
<div class="card">连接<div class="value" id="online">否</div></div><div class="card">采集进度<div class="value" id="count">0/25</div></div>
<div class="card">角点 / 亮度 / 清晰度<div class="value" id="quality">-</div></div><div class="card">检测方式 / PnP误差<div class="value" id="method">-</div></div>
<div class="card">末端平移跨度<div class="value" id="translation">0 mm</div></div><div class="card">末端旋转跨度<div class="value" id="rotation">0°</div></div></div>
<p>推荐采集进度（目标25组）</p><div class="progress"><i id="bar" style="width:0"></i></div>
<h3 style="margin-top:16px">姿态多样性建议</h3><pre id="diversity">-</pre><h3>机械臂末端（基座系）</h3><pre id="arm">尚未连接</pre><h3>相机与内参</h3><pre id="camera">尚未连接</pre><h3>质量与错误</h3><pre id="errors">-</pre></aside></div>
<section class="panel" style="margin-top:14px"><h3>眼在手上标定结果</h3><pre id="result">建议采集20～25组且姿态变化充分后，再点击“结束并计算”。输出为 gripper_T_camera。</pre></section></div>
<script>
const $=x=>document.getElementById(x);async function api(url){let r=await fetch(url,{method:'POST'}),t=await r.text(),v;try{v=JSON.parse(t)}catch{v=t}if(!r.ok)throw Error(v.detail||t);return v}function msg(x,bad=false){$('message').textContent=x;$('message').className=bad?'bad':'ok'}
async function refresh(){try{let s=await fetch('/api/status',{cache:'no-store'}).then(r=>r.json());let side=s.arm_side==='left'?'左臂':'右臂';$('title').textContent=`${side} · 眼在手上手眼标定`;$('online').textContent=s.connected?'是':'否';$('online').className='value '+(s.connected?'ok':'bad');$('count').textContent=`${s.sample_count}/${s.sample_target}`;$('bar').style.width=Math.min(100,100*s.sample_count/s.sample_target)+'%';let q=s.quality||{};$('quality').textContent=`${q.corners||0} / ${q.brightness??'-'} / ${q.blur_score??'-'}`;$('quality').className='value '+(q.ok?'ok':'bad');$('method').textContent=`${q.detection_method||'-'} / ${q.reprojection_rms_px??'-'} px`;$('translation').textContent=`${s.diversity.translation_span_mm} mm`;$('rotation').textContent=`${s.diversity.rotation_span_deg}°`;$('diversity').textContent=s.diversity.hint;$('arm').textContent=s.arm?JSON.stringify(s.arm,null,2):'尚未连接';$('camera').textContent=JSON.stringify({expected_serial:s.camera_serial_expected,intrinsics:s.intrinsics},null,2);$('errors').textContent=[q.reason,s.last_error].filter(Boolean).join('\n')||'-'}catch(e){msg(e.message,true)}}setInterval(refresh,500);refresh();
$('connect').onclick=()=>api('/api/connect').then(()=>msg('相机和机械臂连接成功，对应分辨率内参已保存')).catch(e=>msg(e.message,true));$('disconnect').onclick=()=>api('/api/disconnect').then(()=>msg('已断开')).catch(e=>msg(e.message,true));$('capture').onclick=()=>api('/api/capture').then(x=>msg(`样本 ${x.index} 保存成功，角点 ${x.quality.corners}`)).catch(e=>msg(e.message,true));$('reject').onclick=()=>api('/api/reject').then(()=>msg('当前画面已拒绝，不计入标定样本')).catch(e=>msg(e.message,true));$('undo').onclick=()=>api('/api/undo').then(x=>msg(`样本 ${x.index} 已移入 rejected`)).catch(e=>msg(e.message,true));$('calculate').onclick=()=>{msg('正在计算 gripper_T_camera，请稍候…');api('/api/calibrate').then(x=>{$('result').textContent=JSON.stringify(x,null,2);msg('眼在手上标定计算完成，结果已保存')}).catch(e=>msg(e.message,true))};
</script></body></html>

schema_version: 1
description: WRC抓取流程固定预设状态；不包含导航点和动态计算位姿
conventions:
  arm_pose_order:
  - x
  - y
  - z
  - rx
  - ry
  - rz
  arm_position_unit: m
  arm_orientation_unit: rad
  arm_euler_order: xyz
  head_unit: servo_value
  null_behavior: 不控制该部件，禁止解释为零位
  execution_rule: 只移动apply_components中的部件；参与执行的部件为null时禁止执行
presets:
  robot_initial_safe:
    description: 机器人初始安全状态；待机器人到位后记录
    apply_components:
    - torso
    - left_arm
    status: ready
    updated_at: '2026-08-08T10:51:24+08:00'
    source: actual_robot_state
    head:
      yaw: null
      pitch: null
    torso:
      height: 800
      unit: mm
    left_arm:
      frame: left_arm_base
      pose_6d:
      - 0.078825
      - -0.336597
      - 0.000166
      - -2.636
      - 1.534
      - 2.085
    right_arm:
      frame: right_arm_base
      pose_6d: null
  receipt_scan:
    description: 小票识别状态；待机器人到位后记录

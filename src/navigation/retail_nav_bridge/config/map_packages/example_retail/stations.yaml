# Retail service competition stations (approx 6m x 8m field, origin at start).
# x/y/yaw：填 HMI「导航节点」坐标（s2_station_nav_mode:=pose 时 GoToStation 走 CreateTaskByPose）
# vendor_target_id：仅在 s2_station_nav_mode:=id 且点类型为「站台节点」时使用
map_name: retail_default
stations:
  start:
    display_name: "起点"
    x: -1.956
    y: -0.030
    yaw: 0.0
    arrive_tol_m: 0.10
    yaw_tol_rad: 0.20
    max_speed: 0.5
    vendor_target_id: 1

  delivery_desk:
    display_name: "交付台"   # 对应 HMI 导航点2 (0.243, -0.064)

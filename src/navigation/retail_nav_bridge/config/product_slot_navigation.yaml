# Agent target_id -> retail_stations.yaml station_id.
# 商品货位格式：H<1|2>_<F|B>_L<1..5>_C<两位列号>。
#
# 当前 hotel1：left_max_column=3，即 C01–C03 左手，C04 及以后右手。
# H1_F = 主抓取面（5 左 / 4 右），后退 mark_6。
# H1_B = 货架另一面（2 左 / 3 右），后退 mark_7。
# H2 暂无点位。

aliases:
  receipt_place: mark_0            # 小票位
  delivery_place: mark_1           # 交付台
  left_grasp: mark_5               # 左手抓取
  right_grasp: mark_4              # 右手抓取
  shelf_back_left: mark_2          # 另一面左手
  shelf_back_right: mark_3         # 另一面右手
  retreat: mark_6                  # 正面后退点
  retreat_back: mark_7             # 反面后退点

faces:
  H1_F:
    left_max_column: 3
    levels:
      L1: 7
      L2: 13
      L3: 7
      L4: 5
      L5: 5
    station_ids:
      - mark_5
      - mark_5
      - mark_4
      - mark_4

  H1_B:
    left_max_column: 3
    levels:
      L1: 7
      L2: 7
      L3: 6
      L4: 6
      L5: 6
    station_ids:
      - mark_2
      - mark_2
      - mark_3
      - mark_3

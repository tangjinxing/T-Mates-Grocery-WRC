# Agent target_id -> retail_stations.yaml station_id.
# 商品货位格式：H<1|2>_<F|B>_L<1..5>_C<两位列号>。
# levels 必须与商品摆放表中“该货架面 + 该层”的总列数一致。
# 下列数据依据当前商品摆放表填写；摆放表变化时必须同步修改。
# 分段按商品列中心就近选择；恰好位于两个分段点中间时选择较小编号。
#
# 当前 hj1 联调：HTTP 别名（见 retail_stations.yaml）。1→0 用 delivery_place。

aliases:
  replenishment_pickup: mark_1   # 储位 1
  delivery_place: mark_0         # 储位 0
  # task_boundary: mark_2        # hj1 无此点

faces:
  H1_F:
    levels:
      L1: 7
      L2: 13
      L3: 7
      L4: 5
      L5: 5
    station_ids:
      - shelf_group_a_front
      - shelf_group_a_front_2
      - shelf_group_a_front_3
      - shelf_group_a_front_4

  H1_B:
    levels:
      L1: 7
      L2: 7
      L3: 6
      L4: 6
      L5: 6
    station_ids:
      - shelf_group_a_back
      - shelf_group_a_back_2
      - shelf_group_a_back_3
      - shelf_group_a_back_4

  H2_F:
    levels:
      L1: 6
      L2: 5
      L3: 6
      L4: 8
      L5: 7
    station_ids:
      - shelf_group_b_front
      - shelf_group_b_front_2
      - shelf_group_b_front_3
      - shelf_group_b_front_4

  H2_B:
    levels:
      L1: 5
      L2: 5
      L3: 6
      L4: 3
      L5: 2
    station_ids:
      - shelf_group_b_back
      - shelf_group_b_back_2
      - shelf_group_b_back_3
      - shelf_group_b_back_4

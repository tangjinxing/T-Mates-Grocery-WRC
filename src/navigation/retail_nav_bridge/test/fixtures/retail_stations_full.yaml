# Retail service competition station template: 16 shelf points + 4 business points.
# 货架组：A/B；货架面：front=正面、back=反面；无后缀及 _2~_4
# 表示面对货架时从左到右的四等分点。保留既有首点 ID，兼容现有调用。
# x/y/yaw：填 HMI「导航节点」实测坐标（s2_station_nav_mode:=pose 时走 CreateTaskByPose）。
# vendor_node_id：填写 XML 拓扑节点 ID；vendor_target_id：填写 RCS 导航任务 ID。
# 所有标有 TODO 的 0 值仅为模板，真机导航前必须完成标定和点位同步。
